<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Clivora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/clivora/static/assets/css/styles.css">
  <link rel="stylesheet" href="/clivora/static/assets/css/clivora-theme.css">
</head>

<body class="login-page">
  <div class="login-overlay has-hero" id="loginOverlay">
    <div class="login-particles" id="loginParticles"></div>
    <section class="login-hero" aria-hidden="true">
      <div class="login-hero-brand">
        <img src="/clivora/static/assets/img/clivora-logo-blanco.svg" alt="" width="44" height="44">
        <span>Clivora<small>por Codevia</small></span>
      </div>
      <svg class="login-hero-chart" viewBox="0 0 600 260">
        <path d="M0 200 L90 170 L180 182 L270 120 L360 136 L450 80 L600 100 L600 260 L0 260 Z" fill="#C9D6EC" opacity="0.18"/>
        <path d="M0 214 L90 190 L180 200 L270 150 L360 160 L450 116 L600 128 L600 260 L0 260 Z" fill="#C9D6EC" opacity="0.35"/>
        <path d="M0 230 L90 212 L180 220 L270 184 L360 192 L450 156 L600 166 L600 260 L0 260 Z" fill="#9DB6E3"/>
        <path d="M0 200 L90 170 L180 182 L270 120 L360 136 L450 80 L600 100" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      </svg>
      <div>
        <h2>El expediente, la agenda y la farmacia <strong>en un solo lugar.</strong></h2>
        <p>Plataforma clínica de Codevia.</p>
      </div>
    </section>
    <div class="login-card" id="loginCard">
      <div class="login-logo">
        <div class="login-logo-icon">
          <img src="/clivora/static/assets/img/clivora-logo.svg" alt="Clivora" class="theme-logo-light"
            style="width: 100%; height: auto; object-fit: contain;">
          <img src="/clivora/static/assets/img/clivora-logo-blanco.svg" alt="Clivora" class="theme-logo-dark"
            style="width: 100%; height: auto; object-fit: contain; display: none;">
        </div>
        <h1 class="login-brand">Clivora</h1>
        <p class="login-brand-sub">por Codevia</p>
      </div>

      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="login-field">
          <label for="loginEmail">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Correo electrónico
          </label>
          <input type="text" id="loginEmail" name="login" placeholder="Ingresa tu correo" autocomplete="username"
            required autofocus>
        </div>
        <div class="login-field">
          <label for="loginPassword">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Contraseña
          </label>
          <input type="password" id="loginPassword" name="password" placeholder="Ingresa tu contraseña"
            autocomplete="current-password" required>
          <!-- Restablecer contraseña con el diseño de Clivora
               (templates/reset_password.html): manda por correo un enlace
               para elegir una nueva y al terminar regresa aquí. -->
          <a href="/clivora/reset_password" class="login-forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="login-error" id="loginError">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          <span id="loginErrorText">Credenciales incorrectas</span>
        </div>
        <button type="submit" class="login-submit" id="loginSubmitBtn">
          <span class="login-btn-text">Iniciar Sesión</span>
          <span class="login-btn-spinner"></span>
        </button>
      </form>

      <p class="login-footer-text">Acceso para doctores y personal de la clínica</p>
    </div>

    <!-- Success animation overlay -->
    <div class="login-success-overlay" id="loginSuccessOverlay">
      <div class="success-pulse-ring ring-1"></div>
      <div class="success-pulse-ring ring-2"></div>
      <div class="success-pulse-ring ring-3"></div>

      <div class="success-particles" id="successParticles"></div>

      <div class="success-logo-anim">
        <img src="/clivora/static/assets/img/clivora-logo-blanco.svg" alt="Clivora"
          style="width: 48px; height: auto; object-fit: contain;">
      </div>

      <div class="login-success-check">
        <svg viewBox="0 0 52 52">
          <circle class="login-check-circle" cx="26" cy="26" r="25" fill="none" />
          <path class="login-check-path" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
        </svg>
      </div>

      <h2 class="login-success-name" id="loginSuccessName">Bienvenido</h2>
      <p class="login-success-role" id="loginSuccessRole"></p>

      <div class="success-bottom-bar">
        <div class="success-bar-fill"></div>
      </div>
    </div>
  </div>

  <script src="/clivora/static/assets/js/login.js"></script>
</body>

</html>
