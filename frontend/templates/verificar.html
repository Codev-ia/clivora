<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación en dos pasos - Clivora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/clivora/static/assets/css/styles.css">
  <link rel="stylesheet" href="/clivora/static/assets/css/clivora-theme.css">
</head>

<!-- Segundo paso del inicio de sesión (verificación en dos pasos). data-state lo
     llena el servidor (apps/web/verificar.py): nombre del usuario y días que
     dura "confiar en este equipo". -->
<body class="login-page" data-state="__VERIFY_STATE__">
  <div class="login-overlay" id="loginOverlay">
    <div class="login-particles" id="loginParticles"></div>
    <div class="login-card" id="loginCard">
      <div class="login-logo">
        <div class="login-logo-icon">
          <img src="/clivora/static/assets/img/clivora-logo.svg" alt="Clivora" class="theme-logo-light"
            style="width: 100%; height: auto; object-fit: contain;">
          <img src="/clivora/static/assets/img/clivora-logo-blanco.svg" alt="Clivora" class="theme-logo-dark"
            style="width: 100%; height: auto; object-fit: contain; display: none;">
        </div>
        <h1 class="login-brand">Clivora</h1>
        <p class="login-brand-sub">por Codevia</p>
      </div>

      <form class="login-form" id="verifyForm" autocomplete="off">
        <div class="reset-heading">
          <h2>Verificación en dos pasos</h2>
          <p id="verifyHint">Escribe el código de 6 dígitos de tu app de autenticación.</p>
        </div>
        <div class="login-field">
          <label for="verifyCode" id="verifyCodeLabel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            Código de verificación
          </label>
          <input type="text" id="verifyCode" name="code" placeholder="123456" inputmode="numeric"
            autocomplete="one-time-code" maxlength="6" required class="verify-code-input">
        </div>
        <label class="verify-remember">
          <input type="checkbox" id="verifyRemember">
          <span id="verifyRememberText">No volver a pedirlo en este equipo durante 30 días</span>
        </label>
        <div class="login-error" id="verifyError">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
          <span class="login-error-text"></span>
        </div>
        <button type="submit" class="login-submit">
          <span class="login-btn-text">Verificar</span>
          <span class="login-btn-spinner"></span>
        </button>
        <button type="button" class="login-forgot-link verify-toggle" id="verifyToggle">¿No tienes tu teléfono? Usa un código de recuperación</button>
      </form>

      <a href="/clivora/logout" class="login-forgot-link reset-back-link">← Volver al inicio de sesión</a>
    </div>
  </div>

  <script src="/clivora/static/assets/js/verificar.js"></script>
</body>

</html>
