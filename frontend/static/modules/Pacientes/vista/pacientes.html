<header class="pacientes-header">
        <div class="pacientes-title-group"><h1>Pacientes</h1><span>PACIENTES</span></div>
        <button class="btn-primary btn-anim-lift" id="openNuevoPacienteView">+ Agregar Paciente</button>
      </header>

      <section class="search-filter-card">
        <div class="search-radio-group">
          <span class="search-label">Buscar por:</span>
          <label class="radio-option"><input type="radio" name="searchType" value="nombre" checked> Nombre</label>
        </div>
        <div class="search-input-wrapper">
          <input type="text" id="patientSearchInput" placeholder="Buscar paciente...">
          <button class="search-btn" aria-label="Buscar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        </div>
        <div class="view-toggle">
          <button id="btnGridView" class="view-toggle-btn active">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Tarjeta
          </button>
          <button id="btnListView" class="view-toggle-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            Lista
          </button>
        </div>
      </section>

      <div id="pacientesActiveFilterChip" style="display: none; align-items: center; gap: 8px; margin-bottom: 16px;">
        <span class="badge badge-nuevo" id="pacientesActiveFilterLabel">Filtro</span>
        <button type="button" id="pacientesActiveFilterClear" class="btn-secondary btn-anim-lift" style="padding: 4px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;">
          Quitar filtro
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <section class="patient-cards-grid" id="patientsGrid"></section>
