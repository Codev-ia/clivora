# Producción en un VPS (Hostinger KVM u otro): Nginx + Django + PostgreSQL.
#   cp .env.example .env   (y ajustarlo; DATABASE_URL apunta al servicio "db")
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clivora
      POSTGRES_USER: clivora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://clivora:${POSTGRES_PASSWORD}@db:5432/clivora
      MEDIA_ROOT: /srv/clivora/media
    volumes:
      - media:/srv/clivora/media
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
